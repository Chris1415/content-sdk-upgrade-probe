name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Generate component map (no Edge needed)
        run: npm run sitecore-tools:generate-map
      - name: Stub files normally produced by sitecore-tools:build (needs a real Edge context)
        run: |
          echo '[]' > .sitecore/sites.json
          printf 'export const importMap = [];\nexport default importMap;\n' > .sitecore/import-map.server.ts
          cp .sitecore/import-map.server.ts .sitecore/import-map.client.ts
      - name: Type check
        run: npx tsc --noEmit
