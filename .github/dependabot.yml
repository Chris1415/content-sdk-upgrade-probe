# Only patches are grouped. Minor and major updates come as individual PRs (no group pattern overlaps).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "@sitecore-content-sdk/*"
    labels:
      - dependencies
    groups:
      content-sdk-patch:
        patterns: ["@sitecore-content-sdk/*"]
        update-types: ["patch"]
